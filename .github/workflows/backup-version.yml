name: Backup Ontology Version

on:
  release:
    types: [published, created]  # Trigger when a per-module release is created or published

permissions:
  contents: write

jobs:
  backup-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse module + version from tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Release tag: $TAG"
          # Per-module tag convention: <module>-v<semver>, e.g. aec_common_symbols-v1.2.0
          # (module names use '_' and never contain '-v', so this parses unambiguously).
          if [[ ! "$TAG" =~ ^([a-z0-9_]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' does not match '<module>-v<semver>' (e.g. aec_common_symbols-v1.2.0)."
            exit 1
          fi
          echo "module=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "Module: ${BASH_REMATCH[1]}  Version: ${BASH_REMATCH[2]}"

      - name: Verify module source and tag/version match
        run: |
          MODULE="${{ steps.parse.outputs.module }}"
          VERSION="${{ steps.parse.outputs.version }}"
          SRC="src/${MODULE}.ttl"
          if [ ! -f "$SRC" ]; then
            echo "::error::No such module source: $SRC"
            exit 1
          fi
          # The tag version must match the module's declared owl:versionInfo.
          if ! grep -q "owl:versionInfo \"${VERSION}\"" "$SRC"; then
            echo "::error::$SRC does not declare owl:versionInfo \"${VERSION}\" — bump the module before tagging."
            exit 1
          fi

      - name: Snapshot module to versions/<module>/<semver>/
        run: |
          MODULE="${{ steps.parse.outputs.module }}"
          VERSION="${{ steps.parse.outputs.version }}"
          DEST="versions/${MODULE}/${VERSION}"
          mkdir -p "$DEST"
          cp "src/${MODULE}.ttl" "$DEST/${MODULE}.ttl"
          echo "Snapshotted src/${MODULE}.ttl -> $DEST/${MODULE}.ttl"
          ls -la "$DEST"

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push snapshot
        run: |
          MODULE="${{ steps.parse.outputs.module }}"
          VERSION="${{ steps.parse.outputs.version }}"
          git add "versions/${MODULE}/${VERSION}/"
          if git diff --staged --quiet; then
            echo "No changes to commit (snapshot already exists)."
          else
            # No [skip actions]: this push should trigger generate-deploy-docs so the
            # new versioned snapshot is published to GitHub Pages and becomes resolvable.
            git commit -m "chore: snapshot ${MODULE} ${VERSION}"
            git push
          fi

      - name: Summary
        run: |
          echo "Backed up ${{ steps.parse.outputs.module }} ${{ steps.parse.outputs.version }} to versions/${{ steps.parse.outputs.module }}/${{ steps.parse.outputs.version }}/"
