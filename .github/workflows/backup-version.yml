name: Backup Ontology Version

on:
  release:
    types: [published]  # Only when a release is published (a draft's "created" event must not snapshot)
  # A Release published with the default GITHUB_TOKEN (e.g. by the release automation)
  # does not fire the `release` event, so the same job can be started by hand or by
  # another workflow: `gh workflow run backup-version.yml -f tag=<module>-v<semver>`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to snapshot, e.g. aec_common_symbols-v1.2.0"
        required: true

permissions:
  contents: write
  actions: write   # dispatch generate-deploy-docs.yml after the snapshot lands
  pull-requests: read   # release_notes.py lists the PRs behind each release (commits/<sha>/pulls)

concurrency:
  # One snapshot at a time per release tag, to avoid a commit/push race if the
  # event fires more than once.
  group: backup-version-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  backup-version:
    runs-on: ubuntu-latest

    steps:
      - name: Create ADIRO Bot token
        id: app-token
        # The default GITHUB_TOKEN (the GitHub Actions app) cannot be a ruleset bypass actor, so a push to main
        # with it is rejected by a ruleset that requires a pull request (#173). The ADIRO Bot app can be.
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ADIRO_BOT_APP_ID }}
          private-key: ${{ secrets.ADIRO_BOT_PRIVATE_KEY }}

      # A `release` event checks out the tag ref (detached HEAD), which can't be
      # committed/pushed. Check out the default branch to push to, and read the
      # tagged ontology content explicitly via `git show <tag>:...` so the
      # snapshot is the exact tagged file even if the branch has moved on.
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0        # full history
          fetch-tags: true      # ensure the release tag is available for `git show`
          token: ${{ steps.app-token.outputs.token }}   # the push below is made as the ADIRO Bot (#173)

      - name: Parse module + version from tag
        id: parse
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          echo "Release tag: $TAG"
          # Per-module tag convention: <module>-v<semver>, e.g. aec_common_symbols-v1.2.0
          # (module names use '_' and never contain '-v', so this parses unambiguously).
          if [[ ! "$TAG" =~ ^([a-z0-9_]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' does not match '<module>-v<semver>' (e.g. aec_common_symbols-v1.2.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "module=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "Module: ${BASH_REMATCH[1]}  Version: ${BASH_REMATCH[2]}"

      - name: Verify tagged module source and tag/version match
        run: |
          TAG="${{ steps.parse.outputs.tag }}"
          MODULE="${{ steps.parse.outputs.module }}"
          VERSION="${{ steps.parse.outputs.version }}"
          # The checks (data-validation shapes and UC-01 queries, #240) are not a module: the tag version must be a
          # released section of changelogs/checks.md at the tag.
          if [ "$MODULE" = "checks" ]; then
            if ! git show "refs/tags/${TAG}:changelogs/checks.md" | grep -q "^## \[${VERSION}\]"; then
              echo "::error::changelogs/checks.md at tag ${TAG} has no section [${VERSION}] — date the release before tagging."
              exit 1
            fi
            exit 0
          fi
          if ! git cat-file -e "refs/tags/${TAG}:src/${MODULE}.ttl" 2>/dev/null; then
            echo "::error::src/${MODULE}.ttl does not exist at tag ${TAG}."
            exit 1
          fi
          # The tag version must match the module's declared owl:versionInfo at the tag.
          if ! git show "refs/tags/${TAG}:src/${MODULE}.ttl" | grep -q "owl:versionInfo \"${VERSION}\""; then
            echo "::error::src/${MODULE}.ttl at tag ${TAG} does not declare owl:versionInfo \"${VERSION}\" — bump the module before tagging."
            exit 1
          fi

      - name: Snapshot tagged module to versions/<module>/<semver>/
        run: |
          TAG="${{ steps.parse.outputs.tag }}"
          MODULE="${{ steps.parse.outputs.module }}"
          VERSION="${{ steps.parse.outputs.version }}"
          DEST="versions/${MODULE}/${VERSION}"
          if [ "$MODULE" = "checks" ]; then
            # The checks as they are at the tag: the tag's tree is exported by this branch's script (standard library only).
            git worktree add --detach "$RUNNER_TEMP/tagged" "refs/tags/${TAG}"
            python3 scripts/export_checks.py "$DEST" --root "$RUNNER_TEMP/tagged" --version "$VERSION"
            git worktree remove --force "$RUNNER_TEMP/tagged"
            ls -laR "$DEST"
            exit 0
          fi
          mkdir -p "$DEST"
          git show "refs/tags/${TAG}:src/${MODULE}.ttl" > "$DEST/${MODULE}.ttl"
          echo "Snapshotted src/${MODULE}.ttl @ ${TAG} -> $DEST/${MODULE}.ttl"
          # The viewer reads <module>.display.json from the same place, so an earlier release opens with its own layout (#140).
          python3 scripts/archive_display_config.py archive "$MODULE" "$VERSION" --ref "refs/tags/${TAG}"
          ls -la "$DEST"

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push snapshot
        run: |
          MODULE="${{ steps.parse.outputs.module }}"
          VERSION="${{ steps.parse.outputs.version }}"
          git add "versions/${MODULE}/${VERSION}/"
          if git diff --staged --quiet; then
            echo "No changes to commit (snapshot already exists)."
          else
            # [skip actions]: a push by an app starts other workflows; the deploy is dispatched explicitly below.
            git commit -m "chore: snapshot ${MODULE} ${VERSION} [skip actions]"
            # Rebase first: releases for several modules are published back to back,
            # and a snapshot push must not be rejected because another landed meanwhile.
            # Several tags can be dispatched together (release automation), so retry
            # if another snapshot push wins the race.
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && break
              [ "$attempt" = 3 ] && { echo "::error::could not push the snapshot after 3 attempts"; exit 1; }
              sleep $((attempt * 5))
            done
          fi

      - name: Publish the snapshot to GitHub Pages
        # The push above is marked [skip actions], so it does not start generate-deploy-docs.yml (#100).
        # Dispatch it explicitly (with GITHUB_TOKEN, which may dispatch);
        # without this the versioned URL only appears if some later push redeploys.
        # Deliberately unconditional: when the snapshot already exists nothing was
        # pushed, but re-running this job for a tag must still repair a release whose
        # deploy was missed.
        env:
          # The ADIRO Bot token, not GITHUB_TOKEN: a run dispatched with GITHUB_TOKEN is started by github-actions[bot],
          # and GitHub does not start a workflow_run workflow for it, so its failure would never reach the alert watcher (#190).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run generate-deploy-docs.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

      - name: Publish changelog to the GitHub Release notes
        # RES-82 / #49: set the Release body from changelogs/<module>.md so the
        # change notes live in the repo's Releases tab alongside the release,
        # with resolvable ontology URLs. Idempotent (re-running sets the same body).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.parse.outputs.tag }}"
          MODULE="${{ steps.parse.outputs.module }}"
          VERSION="${{ steps.parse.outputs.version }}"
          # Summary (SemVer bump, docs link, compare link), changelog section, the PRs that changed
          # the module since the previous release, and the canonical URLs: see scripts/release_notes.py.
          if [ "$MODULE" = "checks" ]; then
            python3 scripts/export_checks.py --notes "$VERSION" > release-notes.md
          else
            python3 scripts/release_notes.py "$MODULE" "$VERSION" --repo "${{ github.repository }}" > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file release-notes.md

      - name: Summary
        run: |
          echo "Backed up ${{ steps.parse.outputs.module }} ${{ steps.parse.outputs.version }} to versions/${{ steps.parse.outputs.module }}/${{ steps.parse.outputs.version }}/"
