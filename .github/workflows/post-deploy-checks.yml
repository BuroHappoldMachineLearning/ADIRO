name: Post-deploy checks

# The checks of the published site, run after each successful deploy of main (#217): the external links of the built
# site (lychee) and the release IRIs, display configs and archived images (scripts/check_prior_versions.py, #122).
# They used to be jobs of generate-deploy-docs.yml, whose runs are serialised, so every deploy waited for the previous
# run's checks (3 to 7 minutes). Here they have their own queue, and a newer deploy cancels the checks of an older one:
# only the latest site matters. A failure is reported by alert-on-failure.yml, and the release-IRI check also keeps its
# own tracking issue.
#
# workflow_run starts this for a deploy run on any branch; `deployed` keeps only a successful run on the default branch.
# A manual run (workflow_dispatch) checks the latest successful deploy of the default branch.

on:
  workflow_run:
    workflows: [Generate and Deploy Documentation]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # download the artifact of the deploy run

# Only a run that checks a site joins the queue. The group is applied before the `if` of `deployed`, so a run for a failed or
# cancelled deploy, or a deploy of another branch, would otherwise cancel the checks of the site that is live and then skip
# everything; it gets a group of its own instead.
concurrency:
  group: >-
    post-deploy-checks-${{
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
      && 'site' || github.run_id }}
  cancel-in-progress: true

jobs:
  # The deploy run whose site is checked, and its commit.
  deployed:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      sha: ${{ steps.run.outputs.sha }}
    steps:
      - name: Find the deploy run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$EVENT_RUN_ID" ]; then
            echo "run_id=$EVENT_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          else
            gh run list --workflow generate-deploy-docs.yml --branch "$BRANCH" --status success --limit 1 \
              --json databaseId,headSha --jq '.[0] | "run_id=\(.databaseId)\nsha=\(.headSha)"' >> "$GITHUB_OUTPUT"
          fi

  # Docs link-integrity is a retained feature (tracking: #43). Internal / nav links
  # are gated at build by `mkdocs build --strict` above (fails BEFORE deploy);
  # external links are checked post-deploy by lychee here. Keep BOTH when actioning
  # the docs-generator switch (Zensical, #42) and the w3id.org IRI migration
  # (RES-69) - update these checks' config, don't remove them.
  check-links:
    needs: deployed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deployed.outputs.sha }}

      - name: Download the site the deploy built
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: site/
          run-id: ${{ needs.deployed.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check external links in the published site
        uses: lycheeverse/lychee-action@v2
        with:
          # External-only. `--scheme https/http` checks only absolute URLs and
          # skips the site's own relative links (those are gated at build by
          # `mkdocs build --strict`); `.lycheeignore` excludes the internal host,
          # the auth-gated YouTrack, and pyLODE's malformed footer URL
          # (github.com/rdflib/pyLODE/release/<v> -> 404 - generated by pyLODE, out
          # of our control). `--exclude-path site/404.html` skips the Material 404
          # page, whose root-absolute /ADIRO/... links can't be resolved locally.
          # Together these avoid the /ADIRO/ project-subpath false positives that
          # `--base-url` produced (it rewrote e.g. `ORSD_v1.2/` to `github.io/ORSD_v1.2/`,
          # dropping the /ADIRO/ prefix).
          # `--accept` lists 502-504 as "could not verify", not broken: the check sends thousands of requests to github.com
          # (our own issue and edit pages) and a transient 5xx from GitHub itself must not fail the deploy and raise an
          # alert (#202). A 404 still fails, which is what catches a wrong issue number. `--max-concurrency` keeps the
          # check from hammering one host (lychee's default is 128).
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --scheme https
            --scheme http
            --exclude-path site/404.html
            --max-concurrency 16
            --accept '100..=103,200..=299,429,502..=504'
            './site/**/*.html'
          fail: true
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # #122. Every release names all earlier versions with owl:priorVersion, so a tool that reads only the latest release
  # can open the earlier ones. Whether those IRIs resolve can only be answered by the published site, so it is checked
  # here, after the deploy. The offline half (the archive exists, the list is complete) is in validate_ontology.py.
  #
  # A red run on main only notifies whoever merged, so a failure also opens ONE tracking issue (commented on while later
  # deploys keep failing, closed by the first deploy that passes), as ontology-reasoning-on-main does (#104). It is created
  # as the ADIRO Bot so the issue mirror sees it; GITHUB_TOKEN (issues: write, below) is the fallback.
  verify-prior-versions:
    needs: deployed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # only used if the ADIRO Bot token cannot be created

    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deployed.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Every owl:priorVersion IRI resolves to its release, and every archived display config is served
        id: check
        continue-on-error: true   # the tracking issue below must run either way; the last step fails the job
        run: |
          set -o pipefail
          uv run --python 3.12 --no-project --with rdflib python scripts/check_prior_versions.py 2>&1 | tee prior-check.txt

      - name: Create ADIRO Bot token for the tracking issue
        id: app-token
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true   # a token problem must never hide the result; GITHUB_TOKEN is the fallback below
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ADIRO_BOT_APP_ID }}
          private-key: ${{ secrets.ADIRO_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Track the result in one issue
        # Only for the default branch (a manual run may name any branch), and not for a cancelled run.
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TITLE: Published release IRIs and display configs do not resolve
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                 --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ "$OUTCOME" = "failure" ]; then
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "Still failing after the deploy of \`$SHA\` ([run]($RUN))."
            else
              {
                echo "After the deploy of \`$SHA\` ([run]($RUN)), at least one published release IRI (an \`owl:priorVersion\` IRI in \`src/*.ttl\`) or archived display config does not resolve."
                echo ""
                echo "Every release names all of its earlier versions with \`owl:priorVersion\`, so a tool that reads only the latest release (OntoCanvas does not follow a chain) can list and open them; an IRI that does not resolve breaks that. Likely causes: a version was named before its snapshot was published, a snapshot or its pyLODE page is missing from the site, or the site was slow to update (the check already retries for about two minutes). The same check requires every archived display config (\`versions/<module>/<semver>/<module>.display.json\`) to be served next to its release. Re-run the deploy workflow once the site is up to date; to reproduce, run \`uv run python scripts/check_prior_versions.py\`."
                echo ""
                echo "<details open><summary>Check output</summary>"
                echo ""
                echo '```'
                tail -n 40 prior-check.txt 2>/dev/null
                echo '```'
                echo ""
                echo "</details>"
                echo ""
                echo "This issue closes itself when a later deploy passes. The convention is in \`docs/contribute/versioning/\` ([#122](https://github.com/${{ github.repository }}/issues/122))."
              } > issue.md
              gh issue create --title "$TITLE" --body-file issue.md
            fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "Resolves again after the deploy of \`$SHA\` ([run]($RUN)). Closing."
            gh issue close "$num" --reason completed
          fi

      - name: Fail the job if the check failed
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          echo "::error::at least one owl:priorVersion IRI or archived display config does not resolve (see the check output above)"
          exit 1
