name: Validate Ontology

# The ontology checks (validate_ontology.py, compat_diff.py) on a pull request that changes what they read (#316).
# The repository's tests are tests.yml, on every pull request; the one check of the validator that reads other
# files (no internal tool names, #89) is also a test of the real repository there (tests/test_internal_names.py).

on:
  pull_request:
    branches:
      - '**'  # Run on PRs to any branch
    paths:
      - 'src/**'
      - 'versions/**'
      - 'assets/**'
      - 'changelogs/**'
      - 'config/**'
      - 'scripts/validate_ontology.py'
      - 'scripts/example_images.py'
      - 'scripts/module_renames.py'
      - 'scripts/compat_diff.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/validate-ontology.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base branch is needed by the changelog check (#105)
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project
      
      - name: Validate ontology files
        env:
          BASE_REF: origin/${{ github.base_ref }}   # enables the PR-time changelog check (#105)
          # ENFORCE_CHANGELOG: "1"   # uncomment to make a missing changelog entry blocking
          ENFORCE_ARCHIVED_IMAGES: "1"   # an archived release's image that is no longer served blocks (#154; advisory for the first release cycle, #156)
        run: uv run --python 3.12 --no-project python scripts/validate_ontology.py

      - name: Compatibility diff (warn)
        # RES-67, warn mode: classifies each module's change vs its last released
        # snapshot and flags an under-sized SemVer bump. Advisory (never blocks).
        run: uv run --python 3.12 --no-project python scripts/compat_diff.py
