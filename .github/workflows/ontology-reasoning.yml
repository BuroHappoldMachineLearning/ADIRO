name: Ontology reasoning

# RES-36 — standing ontology QA/QC track. On any PR that touches an ontology,
# run an OWL 2 DL reasoner (HermiT) over the whole suite at latest to catch
# INCONSISTENCY and UNSATISFIABLE classes, plus ROBOT `report` for logical /
# structural QC, and post the results as a sticky PR comment.
#
# The actual reasoning is scripts/run_reasoning.sh — the SAME script humans run
# locally (see AGENTS.md "Local ontology reasoning"), so local == CI, no drift.
#
# The reasoner is a BLOCKING gate: a PR that makes the merged suite inconsistent,
# unsatisfiable, or not-valid-OWL-2-DL fails the check (see the enforce step at
# the end). ROBOT `report` stays ADVISORY (warn-only) — only the reasoner blocks.
# (Baseline made clean by RES-71 dropping the owl# import + provenance metadata.)
#
# Java is required only here in CI: OWL DL reasoners + ROBOT are JVM tools with
# no pure-Python equivalent. Imports resolve OFFLINE via src/catalog-v001.xml.
#
# Note: PRs from forks get a read-only GITHUB_TOKEN that can't post comments, so
# the comment step is guarded to run only for same-repo PRs (the reasoning still
# runs either way); ADIRO PRs are branch-based (internal), so it comments as normal.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.ttl'
      - 'src/catalog-v001.xml'
      - 'scripts/run_reasoning.sh'
      - 'scripts/validate_ontology.py'
      - '.github/workflows/ontology-reasoning.yml'

permissions:
  contents: read
  issues: write          # deleting/creating the sticky comment goes via the issues API
  pull-requests: write

concurrency:
  group: ontology-reasoning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ROBOT_VERSION: v1.9.10

jobs:
  reason:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache ROBOT jar
        uses: actions/cache@v4
        with:
          path: .tools/robot.jar
          key: robot-${{ env.ROBOT_VERSION }}

      - name: Reason (HermiT) + report — warn only
        run: bash scripts/run_reasoning.sh

      # validate_ontology.py needs Python; the reasoning itself is JVM-only, so
      # this toolchain exists solely to fold the repo-specific checks into the
      # same comment rather than leaving them buried in another job's log.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project

      # Repo-specific checks live in validate_ontology.py, and their findings are
      # folded into the same comment below. Adding a check there needs no change
      # here: --markdown renders whatever the script reports. Warnings must not
      # fail this job (they are advisory and the reasoner is the gate), so the
      # exit code is swallowed - validate-ontology.yml is where it blocks.
      - name: Repo-specific checks — markdown section
        run: |
          uv run --python 3.12 --no-project python scripts/validate_ontology.py             --markdown .tools/reasoning-out/validate.md || true

      - name: Compose comment
        run: |
          OUT=.tools/reasoning-out
          RC=$(cat "$OUT/reason.rc" 2>/dev/null || echo "1")
          if [ "$RC" = "0" ]; then
            STATUS="✅ **Consistent** — no unsatisfiable classes (HermiT, suite at latest)."
          else
            STATUS="⛔ **Reasoner failed** — the merged suite is inconsistent, has an unsatisfiable class, or is not valid OWL 2 DL. See the reasoner output below. **This fails the check — fix before merge.**"
          fi

          ERR=0; WARN=0; INFO=0
          if [ -f "$OUT/report.tsv" ]; then
            ERR=$(awk -F'\t' 'NR>1 && $1=="ERROR"{n++} END{print n+0}' "$OUT/report.tsv")
            WARN=$(awk -F'\t' 'NR>1 && $1=="WARN"{n++} END{print n+0}' "$OUT/report.tsv")
            INFO=$(awk -F'\t' 'NR>1 && $1=="INFO"{n++} END{print n+0}' "$OUT/report.tsv")
          fi

          {
            echo "## 🧠 Ontology reasoning &amp; QC"
            echo ""
            echo "Whole-suite OWL 2 DL reasoning (**HermiT**) + ROBOT \`report\`, over all modules merged at *latest* (imports resolved offline via \`src/catalog-v001.xml\`). Run via \`scripts/run_reasoning.sh\` — the same script you can run locally (see AGENTS.md). The **reasoner is a blocking gate**; ROBOT \`report\` is advisory. See [RES-36](https://bhmlrnd.youtrack.cloud/issue/RES-36)."
            echo ""
            echo "### Consistency / satisfiability"
            echo "$STATUS"
            echo ""
            echo "### ROBOT report (logical / structural QC)"
            echo "| Level | Count |"
            echo "|---|--:|"
            echo "| ERROR | $ERR |"
            echo "| WARN | $WARN |"
            echo "| INFO | $INFO |"
            echo ""
            if [ "$RC" != "0" ] && [ -f "$OUT/reason.out" ]; then
              echo "<details><summary>Reasoner output</summary>"
              echo ""
              echo '```'
              tail -n 60 "$OUT/reason.out"
              echo '```'
              echo ""
              echo "</details>"
            fi
            if [ -f "$OUT/report.tsv" ] && [ $((ERR + WARN + INFO)) -gt 0 ]; then
              echo "<details><summary>ROBOT report — first 25 rows</summary>"
              echo ""
              echo '```'
              head -n 26 "$OUT/report.tsv"
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            if [ -f "$OUT/validate.md" ]; then
              cat "$OUT/validate.md"
              echo ""
            fi
            echo "<sub>RES-36 · the reasoner blocks (consistency / unsatisfiable / OWL 2 DL — incl. the root-bump-breaks-dependents check); ROBOT \`report\` stays advisory.</sub>"
          } > reasoning-comment.md

          cat reasoning-comment.md

      - name: Create ADIRO Bot token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true   # a token failure must never fail the check
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ADIRO_BOT_APP_ID }}
          private-key: ${{ secrets.ADIRO_BOT_PRIVATE_KEY }}

      - name: Upsert sticky PR comment
        # Fork PRs cannot read the app secrets (nor post with the read-only token), so only post for
        # same-repo PRs; the computation above still runs either way.
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.app-token.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/sticky-comment
        with:
          token: ${{ steps.app-token.outputs.token }}
          marker: "<!-- ontology-reasoning-report -->"
          file: reasoning-comment.md

      # ENFORCE (RES-36): fail the check on a reasoner problem — inconsistency,
      # an unsatisfiable class, or not-valid-OWL-2-DL. Runs AFTER the sticky
      # comment so the ⛔ explanation still posts, and reuses reason.rc from the
      # warn run above (no second reasoning pass). ROBOT `report` stays advisory —
      # only the reasoner blocks. (A rare ROBOT-download/setup failure also yields
      # a non-zero rc; just re-run the job to clear an infra flake.)
      - name: Fail on inconsistency / unsatisfiable classes
        run: |
          RC="$(cat .tools/reasoning-out/reason.rc 2>/dev/null || echo 1)"
          if [ "$RC" != "0" ]; then
            echo "::error::OWL 2 DL reasoning failed (rc=$RC) — the merged suite is inconsistent, has an unsatisfiable class, or is not valid OWL 2 DL. See the reasoning comment on this PR for details."
            exit "$RC"
          fi
          echo "Reasoner OK — suite is consistent with no unsatisfiable classes."
