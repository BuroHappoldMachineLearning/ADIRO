name: Ontology reasoning (warn)

# RES-36 — standing ontology QA/QC track. On any PR that touches an ontology,
# run an OWL 2 DL reasoner (HermiT) over the whole suite at latest to catch
# INCONSISTENCY and UNSATISFIABLE classes, plus ROBOT `report` for logical /
# structural QC, and post the results as a sticky PR comment.
#
# The actual reasoning is scripts/run_reasoning.sh — the SAME script humans run
# locally (see AGENTS.md "Local ontology reasoning"), so local == CI, no drift.
#
# WARN-FIRST (deliberate): the job never fails the PR yet — it only reports.
# Once the suite is confirmed clean (blocked today by RES-71: the owl# import),
# flip to blocking by un-commenting the "enforce" step at the end.
#
# Java is required only here in CI: OWL DL reasoners + ROBOT are JVM tools with
# no pure-Python equivalent. Imports resolve OFFLINE via src/catalog-v001.xml.
#
# Note: PRs from forks get a read-only token, so the comment step no-ops there;
# ADIRO PRs are branch-based (internal), so this works as-is.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.ttl'
      - 'src/catalog-v001.xml'
      - 'scripts/run_reasoning.sh'
      - '.github/workflows/ontology-reasoning.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ontology-reasoning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ROBOT_VERSION: v1.9.10

jobs:
  reason:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache ROBOT jar
        uses: actions/cache@v4
        with:
          path: .tools/robot.jar
          key: robot-${{ env.ROBOT_VERSION }}

      - name: Reason (HermiT) + report — warn only
        run: bash scripts/run_reasoning.sh

      - name: Compose comment
        run: |
          OUT=.tools/reasoning-out
          RC=$(cat "$OUT/reason.rc" 2>/dev/null || echo "1")
          if [ "$RC" = "0" ]; then
            STATUS="✅ **Consistent** — no unsatisfiable classes (HermiT, suite at latest)."
          else
            STATUS="⚠️ **Reasoner could not confirm consistency** — the merged suite is either inconsistent, has an unsatisfiable class, or is not valid OWL 2 DL. See the reasoner output below. *(advisory — does not block this PR yet)*"
          fi

          ERR=0; WARN=0; INFO=0
          if [ -f "$OUT/report.tsv" ]; then
            ERR=$(awk -F'\t' 'NR>1 && $1=="ERROR"{n++} END{print n+0}' "$OUT/report.tsv")
            WARN=$(awk -F'\t' 'NR>1 && $1=="WARN"{n++} END{print n+0}' "$OUT/report.tsv")
            INFO=$(awk -F'\t' 'NR>1 && $1=="INFO"{n++} END{print n+0}' "$OUT/report.tsv")
          fi

          {
            echo "## 🧠 Ontology reasoning &amp; QC — warn mode"
            echo ""
            echo "Whole-suite OWL 2 DL reasoning (**HermiT**) + ROBOT \`report\`, over all modules merged at *latest* (imports resolved offline via \`src/catalog-v001.xml\`). Run via \`scripts/run_reasoning.sh\` — the same script you can run locally (see AGENTS.md). Advisory — see [RES-36](https://bhmlrnd.youtrack.cloud/issue/RES-36)."
            echo ""
            echo "### Consistency / satisfiability"
            echo "$STATUS"
            echo ""
            echo "### ROBOT report (logical / structural QC)"
            echo "| Level | Count |"
            echo "|---|--:|"
            echo "| ERROR | $ERR |"
            echo "| WARN | $WARN |"
            echo "| INFO | $INFO |"
            echo ""
            if [ "$RC" != "0" ] && [ -f "$OUT/reason.out" ]; then
              echo "<details><summary>Reasoner output</summary>"
              echo ""
              echo '```'
              tail -n 60 "$OUT/reason.out"
              echo '```'
              echo ""
              echo "</details>"
            fi
            if [ -f "$OUT/report.tsv" ] && [ $((ERR + WARN + INFO)) -gt 0 ]; then
              echo "<details><summary>ROBOT report — first 25 rows</summary>"
              echo ""
              echo '```'
              head -n 26 "$OUT/report.tsv"
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "<sub>RES-36 · warn mode. Once the suite is confirmed clean, \`reason\` becomes a blocking gate (incl. the root-bump-breaks-dependents check).</sub>"
          } > reasoning-comment.md

          cat reasoning-comment.md

      - name: Upsert sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ontology-reasoning-report -->';
            const body = marker + '\n' + fs.readFileSync('reasoning-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # --- ENFORCE (RES-36 follow-up; keep commented until the suite is confirmed
      #     clean — today it fails only because of the owl# import, RES-71) ---
      # - name: Fail on inconsistency / unsatisfiable classes
      #   run: ENFORCE=1 bash scripts/run_reasoning.sh
