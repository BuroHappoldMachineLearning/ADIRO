name: Ontology reasoning (warn)

# RES-36 — standing ontology QA/QC track. On any PR that touches an ontology,
# run an OWL 2 DL reasoner (HermiT) over the whole suite at latest to catch
# INCONSISTENCY and UNSATISFIABLE classes, plus ROBOT `report` for logical /
# structural QC, and post the results as a sticky PR comment.
#
# WARN-FIRST (deliberate): the job never fails the PR yet — it only reports.
# Once we've confirmed the suite reasons clean, flip `reason` to blocking by
# un-commenting the "enforce" step at the end (RES-36 follow-up).
#
# Java is required only here (in CI): OWL DL reasoners (HermiT/ELK/JFact) and
# ROBOT are JVM tools; there is no pure-Python equivalent for DL consistency /
# unsatisfiability. Contributors keep editing .ttl; CI does the reasoning.
#
# Imports resolve OFFLINE via src/catalog-v001.xml (modules import each other by
# their github.io IRIs) so we reason over THIS PR's sources, not the deployed copies.
#
# Note: PRs from forks get a read-only token, so the comment step no-ops there;
# ADIRO PRs are branch-based (internal), so this works as-is.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.ttl'
      - 'src/catalog-v001.xml'
      - '.github/workflows/ontology-reasoning.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ontology-reasoning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ROBOT_VERSION: v1.9.10

jobs:
  reason:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache ROBOT jar
        id: cache-robot
        uses: actions/cache@v4
        with:
          path: robot.jar
          key: robot-${{ env.ROBOT_VERSION }}

      - name: Download ROBOT
        if: steps.cache-robot.outputs.cache-hit != 'true'
        run: curl -fL -o robot.jar "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"

      - name: Reason (HermiT) + report — warn only
        run: |
          set +e
          INPUTS="--input src/aec_drawing_metadata.ttl --input src/aec_common_symbols.ttl --input src/aec_domain_common.ttl --input src/aec_facade_domain.ttl"

          # Consistency + unsatisfiable-class check over the merged suite at latest.
          java -jar robot.jar merge --catalog src/catalog-v001.xml $INPUTS \
            reason --reasoner hermit --output /tmp/reasoned.ttl > reason.out 2>&1
          echo $? > reason.rc

          # Logical / structural QC on the merged (asserted) suite. Never fails.
          java -jar robot.jar merge --catalog src/catalog-v001.xml $INPUTS \
            report --fail-on none --output report.tsv > report.out 2>&1
          echo "reason rc: $(cat reason.rc)"

      - name: Compose comment
        run: |
          RC=$(cat reason.rc 2>/dev/null || echo "1")
          if [ "$RC" = "0" ]; then
            STATUS="✅ **Consistent** — no unsatisfiable classes (HermiT, suite at latest)."
          else
            STATUS="⛔ **Reasoner flagged a problem** — the suite is inconsistent or has unsatisfiable class(es). See details below. *(advisory — does not block this PR yet)*"
          fi

          ERR=0; WARN=0; INFO=0
          if [ -f report.tsv ]; then
            ERR=$(awk -F'\t' 'NR>1 && $1=="ERROR"{n++} END{print n+0}' report.tsv)
            WARN=$(awk -F'\t' 'NR>1 && $1=="WARN"{n++} END{print n+0}' report.tsv)
            INFO=$(awk -F'\t' 'NR>1 && $1=="INFO"{n++} END{print n+0}' report.tsv)
          fi

          {
            echo "## 🧠 Ontology reasoning &amp; QC — warn mode"
            echo ""
            echo "Whole-suite OWL 2 DL reasoning (**HermiT**) + ROBOT \`report\`, over all four modules merged at *latest* (imports resolved offline via \`src/catalog-v001.xml\`). Advisory — see [RES-36](https://bhmlrnd.youtrack.cloud/issue/RES-36)."
            echo ""
            echo "### Consistency / satisfiability"
            echo "$STATUS"
            echo ""
            echo "### ROBOT report (logical / structural QC)"
            echo "| Level | Count |"
            echo "|---|--:|"
            echo "| ERROR | $ERR |"
            echo "| WARN | $WARN |"
            echo "| INFO | $INFO |"
            echo ""
            if [ "$RC" != "0" ] && [ -f reason.out ]; then
              echo "<details><summary>Reasoner output</summary>"
              echo ""
              echo '```'
              tail -n 60 reason.out
              echo '```'
              echo ""
              echo "</details>"
            fi
            if [ -f report.tsv ] && [ $((ERR + WARN + INFO)) -gt 0 ]; then
              echo "<details><summary>ROBOT report — first 25 rows</summary>"
              echo ""
              echo '```'
              head -n 26 report.tsv
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "<sub>RES-36 · warn mode. Once the suite is confirmed clean, \`reason\` becomes a blocking gate (incl. the root-bump-breaks-dependents check).</sub>"
          } > reasoning-comment.md

          cat reasoning-comment.md

      - name: Upsert sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ontology-reasoning-report -->';
            const body = marker + '\n' + fs.readFileSync('reasoning-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # --- ENFORCE (RES-36 follow-up; keep commented until the suite is confirmed clean) ---
      # - name: Fail on inconsistency / unsatisfiable classes
      #   run: exit $(cat reason.rc)
