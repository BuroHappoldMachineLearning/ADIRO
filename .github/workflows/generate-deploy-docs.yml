name: Generate and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Serialise runs: each run commits regenerated docs/ back to main, so two overlapping
# runs (e.g. two quick pushes) race and the loser's `git push` is rejected non-fast-forward.
# The checks of the published site (external links, release IRIs) run afterwards in post-deploy-checks.yml, outside
# this queue, so a deploy waits only for the deploy before it, not for that deploy's checks (#217).
concurrency:
  group: generate-deploy-docs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project
      
      - name: Validate ontology files
        run: uv run --python 3.12 --no-project python scripts/validate_ontology.py

  test-ttl2md:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run ttl2md tests
        working-directory: ttl2md
        run: uv run --python 3.12 --extra test python -m pytest -q

  test-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project

      - name: Run tests (diagram colours + compat-diff classifier)
        run: uv run --python 3.12 --no-project --with pytest --with pillow --with rdflib --with pyshacl --with pylode==3.2.3 python -m pytest tests -q

  generate-docs:
    needs: [validate, test-ttl2md, test-docs]
    runs-on: ubuntu-latest
    
    steps:
      - name: Create ADIRO Bot token
        id: app-token
        # The default GITHUB_TOKEN (the GitHub Actions app) cannot be a ruleset bypass actor, so a push to main
        # with it is rejected by a ruleset that requires a pull request (#173). The ADIRO Bot app can be.
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ADIRO_BOT_APP_ID }}
          private-key: ${{ secrets.ADIRO_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The branch by name, not the dispatched commit: runs are serialised, and a queued run started from the commit
          # `main` had when it was dispatched, which misses what the run ahead of it committed back (#190).
          ref: ${{ github.ref_name }}
          fetch-depth: 0  # Fetch all history for proper git operations
          token: ${{ steps.app-token.outputs.token }}   # the commit-back push is made as the ADIRO Bot (#173)
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project
      
      - name: Generate ontology documentation (pyLODE + landing page)
        run: uv run --python 3.12 --no-project python scripts/generate_docs.py
      
      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit and push documentation
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Auto-generate ontology documentation [skip actions]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      
      - name: Build MkDocs (Material) site
        # --strict fails the build on broken internal / nav links (dead-link gate,
        # BEFORE deploy) - see #43. Retain this gate across the Zensical
        # generator switch (#42) and the w3id.org IRI migration (RES-69): update
        # the config, don't drop it.
        run: uv run --python 3.12 --no-project mkdocs build --strict

      - name: Publish versioned ontology snapshots into the site
        run: |
          # Serve each versions/<module>/<semver>/<module>.ttl at
          # <site>/<module>/<semver>/<module>.ttl so versioned IRIs resolve
          # (e.g. .../ADIRO/aec_drawing_metadata/2.0.0/aec_drawing_metadata.ttl),
          # and its <module>.display.json beside it (#140), so the viewer opens the release with its own layout.
          if [ -d versions ]; then
            find versions \( -name '*.ttl' -o -name '*.display.json' \) -print0 | while IFS= read -r -d '' f; do
              dest="site/${f#versions/}"
              mkdir -p "$(dirname "$dest")"
              cp "$f" "$dest"
              echo "published $dest"
            done
          else
            echo "No versions/ directory yet; nothing to publish."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/
          # A week, not a day: post-deploy-checks.yml reads it after the run, and a manual run of it checks the latest
          # successful deploy, which can be days old (#217)
          retention-days: 7
  
  deploy:
    needs: generate-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: site/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
