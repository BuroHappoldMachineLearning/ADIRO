name: Generate and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project
      
      - name: Validate ontology files
        run: uv run --python 3.12 --no-project python scripts/validate_ontology.py

  test-ttl2md:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run ttl2md tests
        working-directory: ttl2md
        run: uv run --python 3.12 --extra test python -m pytest -q

  test-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project

      - name: Run diagram colour tests
        run: uv run --python 3.12 --no-project --with pytest --with pillow python -m pytest tests -q

  generate-docs:
    needs: [validate, test-ttl2md, test-docs]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git operations
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project
      
      - name: Generate ontology documentation (pyLODE + landing page)
        run: uv run --python 3.12 --no-project python scripts/generate_docs.py
      
      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit and push documentation
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Auto-generate ontology documentation [skip actions]"
            git push
          fi
      
      - name: Build MkDocs (Material) site
        run: uv run --python 3.12 --no-project mkdocs build

      - name: Publish versioned ontology snapshots into the site
        run: |
          # Serve each versions/<module>/<semver>/<module>.ttl at
          # <site>/<module>/<semver>/<module>.ttl so versioned IRIs resolve
          # (e.g. .../ADIRO/aec_drawing_metadata/2.0.0/aec_drawing_metadata.ttl).
          if [ -d versions ]; then
            find versions -name '*.ttl' -print0 | while IFS= read -r -d '' f; do
              dest="site/${f#versions/}"
              mkdir -p "$(dirname "$dest")"
              cp "$f" "$dest"
              echo "published $dest"
            done
          else
            echo "No versions/ directory yet; nothing to publish."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/
          retention-days: 1
  
  deploy:
    needs: generate-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: site/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
