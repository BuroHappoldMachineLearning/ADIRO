name: Compat-diff PR comment

# RES-67. On a PR that changes an ontology (`src/**.ttl`), maintain a single sticky
# comment with (1) the changes this PR makes (diffed against the base branch) and
# (2) the prospective next version (cumulative — each module's `src/` vs its last
# released snapshot). Report-only; the required-bump *gate* lives in
# validate-ontology.yml (warn mode). Keep both in sync if the script CLI changes.
#
# Comment placement: when the report CHANGES, the old comment is deleted and a new
# one posted, so it lands at the bottom of the thread with a current timestamp - an
# in-place edit leaves it stranded at its original position, where on a long PR it
# reads as stale even when it is not. When the report is UNCHANGED the comment is
# edited in place instead, refreshing only its footer: that keeps the thread quiet
# and avoids notifying every subscriber on a push that changed nothing.
#
# Triggers only on `src/**.ttl` changes — NOT on classifier/script edits — so a
# PR that doesn't touch an ontology never gets a (confusing) version comment.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.ttl'

permissions:
  contents: read
  issues: write          # deleting/creating the sticky comment goes via the issues API
  pull-requests: write

concurrency:
  group: compat-diff-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch to diff this PR's own changes

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project

      - name: Snapshot base-branch src/ (to diff this PR's changes)
        run: |
          BASE="${{ github.base_ref }}"
          git fetch --no-tags origin "$BASE"
          mkdir -p .tools/base-src
          for f in src/*.ttl; do
            name="$(basename "$f")"
            git show "origin/$BASE:src/$name" > ".tools/base-src/$name" 2>/dev/null \
              || echo "  ($name is new in this PR — no base version)"
          done

      - name: Compute comment (this-PR changes + prospective versions)
        run: uv run --python 3.12 --no-project python scripts/compat_diff.py --markdown --base-dir .tools/base-src > compat-diff.md

      - name: Post or refresh the sticky PR comment
        # Fork PRs get a read-only token (comment API 403s), so only post for
        # same-repo PRs; the computation above still runs either way.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- compat-diff-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const report = marker + '\n' + fs.readFileSync('compat-diff.md', 'utf8').trimEnd();

            // Footer carries the head SHA and the time, so a reader can tell the
            // report is current whichever branch below was taken.
            const head = context.payload.pull_request.head.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const stamp = new Date().toISOString().replace('T', ' ').substring(0, 16);
            const footer = '\n\n<sub>Recomputed for `' + head + '` at ' + stamp + ' UTC — [workflow run](' + runUrl + ')</sub>';
            const body = report + footer;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            // Compare the report only - the footer changes on every run by design.
            const stripFooter = (s) => s.split('<sub>Recomputed for')[0].trimEnd();

            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Posted the first version-impact comment.');
            } else if (stripFooter(existing.body) === stripFooter(body)) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info('Version impact unchanged - refreshed the footer in place, no notification.');
            } else {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Version impact changed - reposted at the bottom of the thread.');
            }
