name: Compat-diff PR comment

# RES-67. On a PR that changes an ontology (`src/**.ttl`), maintain a single sticky
# comment with (1) the changes this PR makes (diffed against the base branch) and
# (2) the prospective next version (cumulative — each module's `src/` vs its last
# released snapshot). Report-only; the required-bump *gate* lives in
# validate-ontology.yml (warn mode). Keep both in sync if the script CLI changes.
#
# Comment placement: when the report CHANGES, the old comment is deleted and a new
# one posted, so it lands at the bottom of the thread with a current timestamp - an
# in-place edit leaves it stranded at its original position, where on a long PR it
# reads as stale even when it is not. When the report is UNCHANGED the comment is
# edited in place instead, refreshing only its footer: that keeps the thread quiet
# and avoids notifying every subscriber on a push that changed nothing.
#
# Triggers only on `src/**.ttl` changes — NOT on classifier/script edits — so a
# PR that doesn't touch an ontology never gets a (confusing) version comment.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.ttl'

permissions:
  contents: read
  issues: write          # deleting/creating the sticky comment goes via the issues API
  pull-requests: write

concurrency:
  group: compat-diff-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch to diff this PR's own changes

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project

      - name: Snapshot base-branch src/ (to diff this PR's changes)
        run: |
          BASE="${{ github.base_ref }}"
          git fetch --no-tags origin "$BASE"
          mkdir -p .tools/base-src
          for f in src/*.ttl; do
            name="$(basename "$f")"
            git show "origin/$BASE:src/$name" > ".tools/base-src/$name" 2>/dev/null \
              || echo "  ($name is new in this PR — no base version)"
          done

      - name: Compute comment (this-PR changes + prospective versions)
        run: uv run --python 3.12 --no-project python scripts/compat_diff.py --markdown --base-dir .tools/base-src > compat-diff.md

      - name: Create ADIRO Bot token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true   # a token failure must never fail the check
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ADIRO_BOT_APP_ID }}
          private-key: ${{ secrets.ADIRO_BOT_PRIVATE_KEY }}
          permission-pull-requests: write   # only what commenting needs, not the app's full grant

      - name: Post or refresh the sticky PR comment
        # Fork PRs cannot read the app secrets (nor post with the read-only token), so only post for
        # same-repo PRs; the computation above still runs either way.
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.app-token.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/sticky-comment
        with:
          token: ${{ steps.app-token.outputs.token }}
          marker: "<!-- compat-diff-report -->"
          file: compat-diff.md
