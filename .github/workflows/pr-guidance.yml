name: PR guidance

# #106. The ADIRO Bot's human-readable guidance for a PR: what the author should do about THEIR OWN
# changes (new terms without an rdfs:comment, label clashes, a .ttl change with no changelog entry,
# a `Closes #N` that did not register) plus an OntoCanvas preview link per touched module. The machine
# report stays in the QC comment (ontology-reasoning.yml); this is a separate sticky comment on purpose.
# All logic is scripts/pr_guidance.py; this file only runs it and posts the result.
#
# It comments as the ADIRO Bot GitHub App. Fork PRs cannot read secrets (and have a read-only
# GITHUB_TOKEN), so the job only runs for same-repo PRs.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read   # the app token, not GITHUB_TOKEN, does the commenting

concurrency:
  group: pr-guidance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guidance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create ADIRO Bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ADIRO_BOT_APP_ID }}
          private-key: ${{ secrets.ADIRO_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base branch is needed to tell what this PR changed

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python and dependencies
        run: |
          uv python install 3.12
          uv sync --python 3.12 --no-install-project

      - name: Compute the guidance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          printf '%s' "$PR_BODY" > pr-body.md
          # GitHub's link index lags an edit by a few seconds; give it time before asking what registered.
          sleep 10
          uv run --python 3.12 --no-project python scripts/pr_guidance.py \
            --base-ref "origin/$BASE_REF" \
            --repo "${{ github.repository }}" \
            --head-ref "$HEAD_REF" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --body-file pr-body.md > guidance.md
          cat guidance.md

      - name: Post, refresh or remove the sticky comment
        uses: ./.github/actions/sticky-comment
        with:
          token: ${{ steps.app-token.outputs.token }}
          marker: "<!-- adiro-pr-guidance -->"
          file: guidance.md
