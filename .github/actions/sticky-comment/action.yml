name: Sticky PR comment
description: >
  Keep one comment per PR, identified by a hidden marker, authored by whatever identity the token
  belongs to (the ADIRO Bot). When the report changes it is deleted and reposted at the bottom of the
  thread; when it is unchanged only the footer is refreshed in place, so the thread stays quiet. An empty
  or missing report file removes the comment. Comments with the marker written by another identity (the
  old github-actions[bot] ones) are removed best-effort so no duplicate is left behind.

inputs:
  token:
    description: Token to post with (the ADIRO Bot installation token).
    required: true
  marker:
    description: Hidden HTML marker that identifies the comment, e.g. "<!-- compat-diff-report -->".
    required: true
  file:
    description: Markdown file with the report. The marker is prepended; an empty or missing file deletes the comment.
    required: true
  author:
    description: Login of the identity that owns the comment.
    default: adiro-bot[bot]
  pr-number:
    description: PR to comment on; default is the PR of the triggering event.
    default: ""
  head-sha:
    description: Commit the report was computed for; default is the head of the triggering PR event.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        STICKY_MARKER: ${{ inputs.marker }}
        STICKY_FILE: ${{ inputs.file }}
        STICKY_AUTHOR: ${{ inputs.author }}
        STICKY_PR: ${{ inputs.pr-number }}
        STICKY_SHA: ${{ inputs.head-sha }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const marker = process.env.STICKY_MARKER;
          const author = process.env.STICKY_AUTHOR;
          const { owner, repo } = context.repo;
          const issue_number = Number(process.env.STICKY_PR) || context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const withMarker = comments.filter(c => c.body && c.body.includes(marker));
          const existing = withMarker.find(c => c.user && c.user.login === author);

          // Older copies written by another identity: remove them so there is only one.
          for (const old of withMarker.filter(c => c !== existing)) {
            try {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: old.id });
              core.info(`Removed a ${old.user && old.user.login} copy of the comment.`);
            } catch (e) {
              core.warning(`Could not remove the old comment ${old.id}: ${e.message}`);
            }
          }

          const report = fs.existsSync(process.env.STICKY_FILE)
            ? fs.readFileSync(process.env.STICKY_FILE, 'utf8').trim() : '';
          if (!report) {
            if (existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              core.info('Nothing to report any more - removed the comment.');
            }
            return;
          }

          // The footer carries the head SHA and the time, so a reader can tell the report is current.
          const head = (process.env.STICKY_SHA || context.payload.pull_request.head.sha).substring(0, 7);
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const stamp = new Date().toISOString().replace('T', ' ').substring(0, 16);
          const footer = '\n\n<sub>Recomputed for `' + head + '` at ' + stamp + ' UTC - [workflow run](' + runUrl + ')</sub>';
          const body = (report.includes(marker) ? report : marker + '\n' + report) + footer;

          // Compare the report only - the footer changes on every run by design.
          const stripFooter = (s) => s.split('<sub>Recomputed for')[0].trimEnd();

          if (!existing) {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info('Posted the comment.');
          } else if (stripFooter(existing.body) === stripFooter(body)) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            core.info('Report unchanged - refreshed the footer in place, no notification.');
          } else {
            await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info('Report changed - reposted at the bottom of the thread.');
          }
